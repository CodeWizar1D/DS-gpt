      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #00f0ff, #b026ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #0c1128;
      font-size: 18px;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-title span {
      background: linear-gradient(90deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .meta-date {
      text-align: right;
      font-size: 11px;
      color: #9ca3af;
    }
    .demo-pill {
      display: inline-block;
      padding: 3px 10px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #00f0ff;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }
    /* Main Hero Result Card */
    .result-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 24px;
      align-items: center;
      margin-bottom: 18px;
    }
    .gauge-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .gauge-svg {
      width: 160px;
      height: 160px;
      transform: rotate(-90deg);
    }
    .gauge-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 14;
    }
    .gauge-fill {
      fill: none;
      stroke: ${l};
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: ${x};
      stroke-dashoffset: ${j};
    }
    .gauge-center {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .gauge-score {
      font-size: 38px;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
    }
    .gauge-sub {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9ca3af;
      margin-top: 2px;
    }
    .badge-pill {

      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 8px;

      color: #d1d5db;
      line-height: 1.5;
      margin-bottom: 12px;
    }

      height: 8px;

      font-size: 12px;
